<!doctype html>
<meta charset="utf-8" />
<title>flipbook fixture — spinner and transient toast</title>
<style>
  body {
    font: 16px/1.5 system-ui, sans-serif;
    margin: 0;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .card {
    width: 520px;
    padding: 32px;
    background: #181b22;
    border: 1px solid #2a2f3a;
    border-radius: 12px;
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .status { font-size: 15px; color: #9aa4b2; min-height: 24px; }
  .spinner {
    width: 64px; height: 64px; margin: 28px auto;
    border: 7px solid #2a2f3a; border-top-color: #4c8dff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .panel {
    margin-top: 20px; padding: 20px;
    background: #10331f; border: 1px solid #1f6b3d; border-radius: 8px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 17px; color: #6ee7a0; }
  .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1c3a28; }
  .toast {
    position: fixed; top: 28px; right: 28px;
    padding: 18px 26px; font-size: 17px; font-weight: 600;
    background: #1f6feb; color: #fff;
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .hidden { display: none; }
</style>

<div class="card">
  <h1>Order checkout</h1>
  <div class="status" id="status">Ready. Submitting in 1s…</div>
  <div class="spinner hidden" id="spinner"></div>
  <div class="panel hidden" id="panel">
    <h2>Order confirmed</h2>
    <div class="row"><span>Item</span><span>Widget Pro</span></div>
    <div class="row"><span>Quantity</span><span>3</span></div>
    <div class="row"><span>Total</span><span>$147.00</span></div>
  </div>
</div>
<div class="toast hidden" id="toast">Saved successfully</div>

<script>
  // A fixed, self-driving script so the run is identical every time. The point of
  // the fixture is that a before/after screenshot pair sees only "Ready" and
  // "Order confirmed" — it misses the spinner entirely and the toast completely,
  // because the toast has already vanished by the time the flow ends.
  const $ = (id) => document.getElementById(id);
  const at = (ms, fn) => setTimeout(fn, ms);

  at(1000, () => {
    $("status").textContent = "Processing payment…";
    $("spinner").classList.remove("hidden");
  });
  at(3000, () => {
    $("spinner").classList.add("hidden");
    $("status").textContent = "Done.";
    $("panel").classList.remove("hidden");
  });
  at(5000, () => $("toast").classList.remove("hidden"));
  at(6500, () => $("toast").classList.add("hidden"));
  at(8000, () => { $("status").textContent = "Idle."; });
</script>
